# version: v40_fbs_adverts_lag14
# Заменить файл в репозитории:
# .github/workflows/01_ezhednevnoe_obnovlenie_dannyh.yml

name: Ежедневное обновление данных

on:
  workflow_dispatch:
    inputs:
      store:
        description: "Магазин"
        required: true
        default: "ALL"
        type: choice
        options:
          - ALL
          - TOPFACE
          - MISSTAIS
          - FINICK
      target_date:
        description: "Целевая дата выгрузки YYYY-MM-DD. Пусто = авто-правило: 00:00-14:59 МСК позавчера, 15:00-23:59 МСК вчера."
        required: false
        default: ""
        type: string

  schedule:
    # GitHub cron работает в UTC. Москва = UTC+3.
    # Частые попытки после обновления данных WB:
    # 15:04, 15:14, ..., 23:54 МСК = 12:04, 12:14, ..., 20:54 UTC.
    #
    # Почему не один cron:
    # GitHub Schedule может запускать workflow с задержкой/хаотично.
    # Код сам выбирает целевую дату:
    # - 00:00-14:59 МСК -> позавчера;
    # - 15:00-23:59 МСК -> вчера.
    #
    # Marker-файл в S3 делает так, что полноценная выгрузка проходит только один раз
    # на конкретную WB_TARGET_DATE. Остальные scheduled-попытки быстро завершаются.
    - cron: "4-59/10 12-20 * * *"

concurrency:
  # schedule и manual разделены. Ручной запуск не блокируется автозапуском.
  group: daily-update-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  run:
    name: Ежедневное обновление данных
    runs-on: ubuntu-latest
    timeout-minutes: 570

    env:
      TZ: Europe/Moscow
      STORE_INPUT: ${{ github.event.inputs.store || 'ALL' }}
      TARGET_DATE_INPUT: ${{ github.event.inputs.target_date || '' }}

      REPORT_ENV: ${{ secrets.REPORT_ENV }}
      YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      YC_BUCKET_NAME: ${{ secrets.YC_BUCKET_NAME }}
      YC_ENDPOINT_URL: ${{ secrets.YC_ENDPOINT_URL }}
      WB_PROMO_KEY_TOPFACE: ${{ secrets.WB_PROMO_KEY_TOPFACE }}
      WB_KEY_MISSTAIS: ${{ secrets.WB_KEY_MISSTAIS }}
      FINICK_API_WB: ${{ secrets.FINICK_API_WB }}
      WB_MARKETPLACE_KEY_TOPFACE: ${{ secrets.WB_MARKETPLACE_KEY_TOPFACE }}
      WB_MARKETPLACE_KEY_MISSTAIS: ${{ secrets.WB_MARKETPLACE_KEY_MISSTAIS }}
      WB_FINANCE_KEY_TOPFACE: ${{ secrets.WB_FINANCE_KEY_TOPFACE }}
      WB_FINANCE_KEY_MISSTAIS: ${{ secrets.WB_FINANCE_KEY_MISSTAIS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TORGSTAT_ABC_URL: ${{ secrets.TORGSTAT_ABC_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Workflow diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo "YML_VERSION=v40_fbs_adverts_lag14"
          echo "github.event_name=${{ github.event_name }}"
          echo "github.event.schedule=${{ github.event.schedule }}"
          echo "STORE_INPUT=${STORE_INPUT}"
          echo "UTC now=$(date -u '+%Y-%m-%d %H:%M:%S')"
          TZ=Europe/Moscow date '+MSK now=%Y-%m-%d %H:%M:%S'
          if [ ! -f "ezhednevnoe_obnovlenie_dannyh.py" ]; then
            echo "ERROR: ezhednevnoe_obnovlenie_dannyh.py not found in repo root"
            ls -la
            exit 2
          fi

      - name: Load secrets from REPORT_ENV
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os

          allowed = [
              "YC_ACCESS_KEY_ID",
              "YC_SECRET_ACCESS_KEY",
              "YC_BUCKET_NAME",
              "YC_ENDPOINT_URL",
              "WB_PROMO_KEY_TOPFACE",
              "WB_KEY_MISSTAIS",
              "FINICK_API_WB",
              "WB_MARKETPLACE_KEY_TOPFACE",
              "WB_MARKETPLACE_KEY_MISSTAIS",
              "WB_FINANCE_KEY_TOPFACE",
              "WB_FINANCE_KEY_MISSTAIS",
              "TELEGRAM_BOT_TOKEN",
              "TELEGRAM_CHAT_ID",
              "TORGSTAT_ABC_URL",
          ]

          report_env = os.getenv("REPORT_ENV", "") or ""
          parsed = {}

          for raw_line in report_env.splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue
              if line.startswith("export "):
                  line = line[len("export "):].strip()
              if "=" not in line:
                  continue
              key, value = line.split("=", 1)
              key = key.strip()
              value = value.strip().strip('"').strip("'")
              if key in allowed and value:
                  parsed[key] = value

          loaded = []
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for key in allowed:
                  value = (os.getenv(key) or parsed.get(key) or "").strip()
                  if value:
                      f.write(f"{key}={value}\n")
                      loaded.append(key)

          print("Loaded env names: " + (", ".join(loaded) if loaded else "none"))
          PY

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os

          required = [
              "YC_ACCESS_KEY_ID",
              "YC_SECRET_ACCESS_KEY",
              "YC_BUCKET_NAME",
          ]

          store = os.getenv("STORE_INPUT", "ALL").upper()
          if store in {"ALL", "TOPFACE"}:
              required.append("WB_PROMO_KEY_TOPFACE")
          if store in {"ALL", "MISSTAIS", "MT"}:
              required.append("WB_KEY_MISSTAIS")
          if store in {"ALL", "FINICK"}:
              required.append("FINICK_API_WB")

          missing = [x for x in required if not (os.getenv(x) or "").strip()]
          if missing:
              raise SystemExit("Missing env/secrets after REPORT_ENV load: " + ", ".join(missing))

          print("All required secrets are present after REPORT_ENV load.")
          print("YC_BUCKET_NAME length:", len(os.getenv("YC_BUCKET_NAME", "")))
          PY

      - name: Resolve target date
        id: target_date
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          raw_target = (os.environ.get("TARGET_DATE_INPUT", "") or "").strip()
          now_msk = datetime.now(ZoneInfo("Europe/Moscow"))

          if raw_target:
              if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", raw_target):
                  raise SystemExit(f"target_date должен быть в формате YYYY-MM-DD, получено: {raw_target}")
              target_date = raw_target
              rule = "manual_input_target_date"
          else:
              shift_days = 1 if now_msk.hour >= 15 else 2
              target_date = (now_msk.date() - timedelta(days=shift_days)).strftime("%Y-%m-%d")
              rule = "auto_after_15_yesterday_before_15_day_before_yesterday"

          print("=== Target date resolution ===")
          print(f"MSK now={now_msk:%Y-%m-%d %H:%M:%S}")
          print(f"target_date={target_date}")
          print(f"target_rule={rule}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"WB_TARGET_DATE={target_date}\n")
              f.write(f"TARGET_DATE_RULE={rule}\n")
              f.write(f"SCHEDULE_LOCK_KEY=Служебные файлы/Ежедневное обновление данных/locks/daily_update_{target_date}.json\n")
          PY

      - name: Check schedule marker
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import boto3
          from botocore.exceptions import ClientError

          bucket = (os.environ.get("YC_BUCKET_NAME") or "").strip()
          if not bucket:
              raise SystemExit("YC_BUCKET_NAME is empty after REPORT_ENV load; marker check cannot continue.")

          key = os.environ["SCHEDULE_LOCK_KEY"]
          s3 = boto3.client(
              "s3",
              endpoint_url=os.getenv("YC_ENDPOINT_URL") or "https://storage.yandexcloud.net",
              aws_access_key_id=os.environ["YC_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["YC_SECRET_ACCESS_KEY"],
          )

          already_done = False
          try:
              s3.head_object(Bucket=bucket, Key=key)
              already_done = True
          except ClientError as exc:
              code = str(exc.response.get("Error", {}).get("Code", ""))
              if code not in {"404", "NoSuchKey", "NotFound"}:
                  raise

          print("=== Schedule marker check ===")
          print(f"target_date={os.environ['WB_TARGET_DATE']}")
          print(f"lock_key={key}")
          print(f"already_done={already_done}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"SCHEDULE_ALREADY_DONE={'true' if already_done else 'false'}\n")
          PY

      - name: Stop if schedule already completed
        if: github.event_name == 'schedule' && env.SCHEDULE_ALREADY_DONE == 'true'
        shell: bash
        run: |
          echo "Schedule уже успешно отработал для WB_TARGET_DATE=${WB_TARGET_DATE}: ${SCHEDULE_LOCK_KEY}"
          exit 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pandas openpyxl xlsxwriter requests boto3 python-dateutil numpy pytz

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ezhednevnoe_obnovlenie_dannyh.py

      - name: Run daily update
        shell: bash
        run: |
          set -euo pipefail
          echo "Running daily update for STORE_INPUT=${STORE_INPUT}, WB_TARGET_DATE=${WB_TARGET_DATE}"
          python ezhednevnoe_obnovlenie_dannyh.py --full --store "$STORE_INPUT"

      - name: Write schedule marker after success
        if: success() && github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import json
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import boto3

          bucket = (os.environ.get("YC_BUCKET_NAME") or "").strip()
          if not bucket:
              raise SystemExit("YC_BUCKET_NAME is empty after run; cannot write marker.")

          key = os.environ["SCHEDULE_LOCK_KEY"]
          payload = {
              "workflow_version": "v40_fbs_adverts_lag14",
              "target_date": os.environ.get("WB_TARGET_DATE"),
              "target_date_rule": os.environ.get("TARGET_DATE_RULE"),
              "store_input": os.environ.get("STORE_INPUT"),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "github_run_number": os.environ.get("GITHUB_RUN_NUMBER"),
              "utc_completed_at": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S"),
              "msk_completed_at": datetime.now(ZoneInfo("Europe/Moscow")).strftime("%Y-%m-%d %H:%M:%S"),
          }

          s3 = boto3.client(
              "s3",
              endpoint_url=os.getenv("YC_ENDPOINT_URL") or "https://storage.yandexcloud.net",
              aws_access_key_id=os.environ["YC_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["YC_SECRET_ACCESS_KEY"],
          )
          s3.put_object(
              Bucket=bucket,
              Key=key,
              Body=json.dumps(payload, ensure_ascii=False, indent=2).encode("utf-8"),
              ContentType="application/json",
          )
          print(f"Marker written: {key}")
          PY
