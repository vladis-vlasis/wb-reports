name: Ассистент WB

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Дата расчёта YYYY-MM-DD; пусто = сегодня по Москве"
        required: false
        default: ""
        type: string
      no_api:
        description: "Не читать Promotion API (только отчёты из S3)"
        required: false
        default: false
        type: boolean
  schedule:
    # Один ежедневный аналитический запуск: 12:15 МСК = 09:15 UTC.
    - cron: "15 9 * * *"

permissions:
  contents: read

concurrency:
  group: assistant-wb-finick-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  TZ: "Europe/Moscow"
  PYTHONUNBUFFERED: "1"

jobs:
  assistant_wb:
    name: FINICK — аналитика рекламы
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      REPORT_ENV: ${{ secrets.REPORT_ENV }}
      YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      YC_BUCKET_NAME: ${{ secrets.YC_BUCKET_NAME }}
      YC_S3_ENDPOINT: ${{ secrets.YC_S3_ENDPOINT }}
      FINICK_API_WB: ${{ secrets.FINICK_API_WB }}

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Установить зависимости
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pandas numpy openpyxl xlsxwriter boto3 requests python-dateutil

      - name: Подхватить секреты из REPORT_ENV
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os

          allowed = {
              "YC_ACCESS_KEY_ID",
              "YC_SECRET_ACCESS_KEY",
              "YC_BUCKET_NAME",
              "YC_S3_ENDPOINT",
              "FINICK_API_WB",
          }
          raw = os.getenv("REPORT_ENV", "") or ""
          parsed = {}
          for raw_line in raw.splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue
              if line.startswith("export "):
                  line = line[7:].strip()
              if "=" not in line:
                  continue
              key, value = line.split("=", 1)
              key = key.strip()
              value = value.strip().strip('"').strip("'")
              if key in allowed and value:
                  parsed[key] = value

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for key in sorted(allowed):
                  value = os.getenv(key) or parsed.get(key)
                  if value:
                      f.write(f"{key}={value}\n")
          PY

      - name: Проверить код
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile assistant_wb.py

      - name: Запустить Ассистент WB
        shell: bash
        env:
          INPUT_AS_OF: ${{ inputs.as_of }}
          INPUT_NO_API: ${{ inputs.no_api }}
        run: |
          set -euo pipefail
          ARGS=(--out-dir assistant_output)
          if [[ -n "${INPUT_AS_OF:-}" ]]; then
            ARGS+=(--as-of "$INPUT_AS_OF")
          fi
          if [[ "${INPUT_NO_API:-false}" == "true" ]]; then
            ARGS+=(--no-api)
          fi
          python assistant_wb.py "${ARGS[@]}"

      - name: Проверить три результата
        shell: bash
        run: |
          set -euo pipefail
          test -s assistant_output/state.sqlite3
          test -s assistant_output/ui_payload.json
          test -s assistant_output/Техническая_аналитика.xlsx
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          json.load(open("assistant_output/ui_payload.json", encoding="utf-8"))
          con = sqlite3.connect("assistant_output/state.sqlite3")
          con.execute("SELECT 1 FROM runs LIMIT 1").fetchall()
          con.close()
          print("Результаты Ассистента WB валидны")
          PY

      - name: Сохранить результаты запуска
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ассистент-WB-FINICK-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            assistant_output/state.sqlite3
            assistant_output/ui_payload.json
            assistant_output/Техническая_аналитика.xlsx
