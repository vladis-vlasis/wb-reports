name: Ozon FBO — сбор данных v17 Integrity Repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test — 1 день; daily — вчера + ремонт; history — пересборка изменённых схем и дозагрузка 60 дней; archive — ZIP за 1 день; archive_all — один ZIP со всеми накопленными файлами"
        required: true
        type: choice
        default: test
        options:
          - test
          - daily
          - history
          - archive
          - archive_all
      target_date:
        description: "YYYY-MM-DD. Пусто — всегда предыдущий календарный день по Москве"
        required: false
        type: string
      store:
        description: "Магазин"
        required: true
        type: choice
        default: FINICK
        options:
          - TOPFACE
          - FINICK
          - ALL
      repair_days_per_run:
        description: "Сколько старых пропущенных дней догружать в daily"
        required: false
        type: string
        default: "5"

  schedule:
    # 01:20 МСК — предварительный EARLY-снимок за вчера.
    - cron: "20 22 * * *"
    # 15:20 МСК — повторный FINAL-снимок за тот же вчерашний день.
    - cron: "20 12 * * *"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      stores: ${{ steps.matrix.outputs.stores }}
      mode: ${{ steps.matrix.outputs.mode }}
      target_date: ${{ steps.matrix.outputs.target_date }}
      repair_days: ${{ steps.matrix.outputs.repair_days }}
    steps:
      - name: Prepare matrix
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_STORE: ${{ github.event.inputs.store }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_TARGET_DATE: ${{ github.event.inputs.target_date }}
          INPUT_REPAIR_DAYS: ${{ github.event.inputs.repair_days_per_run }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          event_name = os.getenv("EVENT_NAME", "")
          selected_store = (os.getenv("INPUT_STORE", "") or "ALL").upper()
          mode = os.getenv("INPUT_MODE", "") or "daily"
          target_date = os.getenv("INPUT_TARGET_DATE", "") or ""
          repair_days = os.getenv("INPUT_REPAIR_DAYS", "") or "5"

          if mode == "archive_all":
              stores = ["ALL" if selected_store == "ALL" else selected_store]
          elif event_name == "schedule" or selected_store == "ALL":
              stores = ["TOPFACE", "FINICK"]
          else:
              stores = [selected_store]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("stores=" + json.dumps(stores, ensure_ascii=False) + "\n")
              fh.write(f"mode={mode}\n")
              fh.write(f"target_date={target_date}\n")
              fh.write(f"repair_days={repair_days}\n")
          PY

  collect:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        store: ${{ fromJSON(needs.prepare.outputs.stores) }}

    runs-on: ubuntu-latest
    timeout-minutes: 240

    concurrency:
      group: ozon-fbo-data-v17-${{ matrix.store }}
      cancel-in-progress: false

    env:
      REPORT_ENV: ${{ secrets.REPORT_ENV }}
      YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      YC_BUCKET_NAME: ozon-assist
      YC_ENDPOINT_URL: https://storage.yandexcloud.net

      OZON_MODE: ${{ needs.prepare.outputs.mode }}
      OZON_TARGET_DATE: ${{ needs.prepare.outputs.target_date }}
      OZON_REPAIR_DAYS_PER_RUN: ${{ needs.prepare.outputs.repair_days }}
      OZON_STORE: ${{ matrix.store }}

      OZON_CLIENT_ID_TOPFACE: ${{ secrets.OZON_CLIENT_ID_TOPFACE }}
      OZON_API_KEY_TOPFACE: ${{ secrets.OZON_API_KEY_TOPFACE }}
      OZON_CLIENT_ID_FINICK: ${{ secrets.OZON_CLIENT_ID_FINICK }}
      OZON_API_KEY_FINICK: ${{ secrets.OZON_API_KEY_FINICK }}

      OZON_PERFORMANCE_CLIENT_ID_TOPFACE: ${{ secrets.OZON_PERFORMANCE_CLIENT_ID_TOPFACE }}
      OZON_PERFORMANCE_CLIENT_SECRET_TOPFACE: ${{ secrets.OZON_PERFORMANCE_CLIENT_SECRET_TOPFACE }}
      OZON_PERFORMANCE_CLIENT_ID_FINICK: ${{ secrets.OZON_PERFORMANCE_CLIENT_ID_FINICK }}
      OZON_PERFORMANCE_CLIENT_SECRET_FINICK: ${{ secrets.OZON_PERFORMANCE_CLIENT_SECRET_FINICK }}

      PYTHONUNBUFFERED: "1"
      TZ: "Europe/Moscow"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pandas openpyxl requests boto3

      - name: Load REPORT_ENV
        run: |
          set -euo pipefail
          python - <<'PY'
          import os

          allowed = {
              "YC_ACCESS_KEY_ID", "YC_SECRET_ACCESS_KEY",
              "OZON_CLIENT_ID_TOPFACE", "OZON_API_KEY_TOPFACE",
              "OZON_CLIENT_ID_FINICK", "OZON_API_KEY_FINICK",
              "OZON_PERFORMANCE_CLIENT_ID_TOPFACE",
              "OZON_PERFORMANCE_CLIENT_SECRET_TOPFACE",
              "OZON_PERFORMANCE_CLIENT_ID_FINICK",
              "OZON_PERFORMANCE_CLIENT_SECRET_FINICK",
          }
          parsed = {}
          for raw in (os.getenv("REPORT_ENV", "") or "").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              if line.startswith("export "):
                  line = line[7:].strip()
              if "=" not in line:
                  continue
              key, value = line.split("=", 1)
              key = key.strip()
              value = value.strip().strip('"').strip("'")
              if key in allowed and value:
                  parsed[key] = value

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              for key in sorted(allowed):
                  value = os.getenv(key) or parsed.get(key)
                  if value:
                      fh.write(f"{key}={value}\n")
          PY

      - name: Verify secrets for selected store
        run: |
          set -euo pipefail
          python - <<'PY'
          import os

          store = os.environ["OZON_STORE"]
          mode = os.environ["OZON_MODE"]
          required = ["YC_ACCESS_KEY_ID", "YC_SECRET_ACCESS_KEY"]
          if mode != "archive_all":
              required.extend([f"OZON_CLIENT_ID_{store}", f"OZON_API_KEY_{store}"])
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing secrets: " + ", ".join(missing))

          if mode != "archive_all":
              perf_id = os.getenv(f"OZON_PERFORMANCE_CLIENT_ID_{store}")
              perf_secret = os.getenv(f"OZON_PERFORMANCE_CLIENT_SECRET_{store}")
              if bool(perf_id) != bool(perf_secret):
                  raise SystemExit(
                      "Performance secrets must be set as a pair for " + store
                  )
          print("Required secrets are present for", store, "mode", mode)
          PY

      - name: Validate code
        run: python -m py_compile ozon_daily_data_collector.py

      - name: Run collector
        run: |
          set -euo pipefail
          ARGS=(
            --mode "$OZON_MODE"
            --store "$OZON_STORE"
            --repair-days-per-run "$OZON_REPAIR_DAYS_PER_RUN"
          )
          if [[ -n "${OZON_TARGET_DATE:-}" ]]; then
            ARGS+=(--target-date "$OZON_TARGET_DATE")
          fi
          python ozon_daily_data_collector.py "${ARGS[@]}"

      - name: Upload generated archive
        if: ${{ needs.prepare.outputs.mode == 'archive_all' || needs.prepare.outputs.mode == 'archive' }}
        uses: actions/upload-artifact@v4
        with:
          name: ozon-reports-archive-${{ matrix.store }}-${{ github.run_id }}
          path: output_ozon_v17/**/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload local diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ozon-data-collector-v17-failure-${{ matrix.store }}-${{ github.run_id }}
          path: output_ozon_v17/
          if-no-files-found: ignore
          retention-days: 7
