name: Ozon FBO — сбор данных v10 Premium pagination probe

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test — 1 день; daily — последние 90 дней; archive — ZIP строго 1 выбранного дня"
        required: true
        type: choice
        default: test
        options:
          - test
          - daily
          - archive
      target_date:
        description: "YYYY-MM-DD. Пусто: после 15:00 МСК вчера, до 15:00 МСК позавчера"
        required: false
        type: string
      store:
        description: "Магазин"
        required: true
        type: choice
        default: TOPFACE
        options:
          - TOPFACE

  schedule:
    - cron: "20 12 * * *" # ежедневно 15:20 МСК; режим daily

concurrency:
  group: ozon-fbo-data-${{ github.event.inputs.store || 'TOPFACE' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      REPORT_ENV: ${{ secrets.REPORT_ENV }}
      YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      YC_BUCKET_NAME: ozon-assist
      YC_ENDPOINT_URL: https://storage.yandexcloud.net

      OZON_MODE: ${{ github.event_name == 'schedule' && 'daily' || github.event.inputs.mode }}
      OZON_TARGET_DATE: ${{ github.event.inputs.target_date }}
      OZON_STORE: ${{ github.event.inputs.store || 'TOPFACE' }}

      OZON_CLIENT_ID_TOPFACE: ${{ secrets.OZON_CLIENT_ID_TOPFACE }}
      OZON_API_KEY_TOPFACE: ${{ secrets.OZON_API_KEY_TOPFACE }}
      OZON_PERFORMANCE_CLIENT_ID_TOPFACE: ${{ secrets.OZON_PERFORMANCE_CLIENT_ID_TOPFACE }}
      OZON_PERFORMANCE_CLIENT_SECRET_TOPFACE: ${{ secrets.OZON_PERFORMANCE_CLIENT_SECRET_TOPFACE }}

      PYTHONUNBUFFERED: "1"
      TZ: "Europe/Moscow"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pandas openpyxl requests boto3

      - name: Load REPORT_ENV
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          allowed = {
              "YC_ACCESS_KEY_ID", "YC_SECRET_ACCESS_KEY",
              "OZON_CLIENT_ID_TOPFACE", "OZON_API_KEY_TOPFACE",
              "OZON_PERFORMANCE_CLIENT_ID_TOPFACE",
              "OZON_PERFORMANCE_CLIENT_SECRET_TOPFACE",
          }
          parsed = {}
          for raw in (os.getenv("REPORT_ENV", "") or "").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              if line.startswith("export "):
                  line = line[7:].strip()
              if "=" not in line:
                  continue
              key, value = line.split("=", 1)
              key = key.strip()
              value = value.strip().strip('"').strip("'")
              if key in allowed and value:
                  parsed[key] = value
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              for key in allowed:
                  value = os.getenv(key) or parsed.get(key)
                  if value:
                      fh.write(f"{key}={value}\n")
          PY

      - name: Verify secrets
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          required = [
              "YC_ACCESS_KEY_ID", "YC_SECRET_ACCESS_KEY",
              "OZON_CLIENT_ID_TOPFACE", "OZON_API_KEY_TOPFACE",
          ]
          missing = [x for x in required if not os.getenv(x)]
          if missing:
              raise SystemExit("Missing secrets: " + ", ".join(missing))
          print("Required secrets are present")
          PY

      - name: Validate code
        run: python -m py_compile ozon_daily_data_collector.py

      - name: Run collector
        run: |
          set -euo pipefail
          ARGS=(--mode "$OZON_MODE" --store "$OZON_STORE")
          if [[ -n "${OZON_TARGET_DATE:-}" ]]; then
            ARGS+=(--target-date "$OZON_TARGET_DATE")
          fi
          python ozon_daily_data_collector.py "${ARGS[@]}"

      - name: Upload local diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ozon-data-collector-v10-failure-${{ github.run_id }}
          path: output_ozon_v1/
          if-no-files-found: ignore
          retention-days: 7
