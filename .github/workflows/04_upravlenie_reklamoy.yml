name: Управление рекламой

on:
  workflow_dispatch:
    inputs:
      store:
        description: "Магазин"
        required: true
        default: "ALL"
        type: choice
        options:
          - ALL
          - TOPFACE
          - FINICK
      live:
        description: "Реально менять CPM-ставки и минус-фразы"
        required: true
        default: false
        type: boolean
      run_legacy:
        description: "Запустить старый контур CPC и полок TOPFACE"
        required: true
        default: true
        type: boolean

  schedule:
    # Старый основной контур TOPFACE: как раньше, каждые 10 минут с 18:00 до 23:50 МСК.
    - cron: "*/10 15-20 * * *"
    # Новый CPM-контур: каждые 2 часа, примерно 00:05, 02:05 ... 22:05 МСК.
    - cron: "5 1-23/2 * * *"

permissions:
  contents: read

concurrency:
  group: upravlenie-reklamoy-${{ github.ref }}-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: false

env:
  WORKFLOW_VERSION: "upravlenie_reklamoy_v90_fix2_2026-08-07"
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: "1"
  TZ: "Europe/Moscow"
  WB_ADS_V90_CONFIG: "wb_ads_v90_config.json"

jobs:
  upravlenie_reklamoy:
    name: Управление рекламой
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      REPORT_ENV: ${{ secrets.REPORT_ENV }}
      YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      YC_BUCKET_NAME: ${{ secrets.YC_BUCKET_NAME }}
      WB_PROMO_KEY_TOPFACE: ${{ secrets.WB_PROMO_KEY_TOPFACE }}
      FINICK_API_WB: ${{ secrets.FINICK_API_WB }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      WB_ADS_V90_LIVE: ${{ vars.WB_ADS_V90_LIVE }}

    steps:
      - name: Загрузить файлы проекта
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Установить зависимости
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pandas openpyxl xlsxwriter requests boto3 python-dateutil numpy pytz reportlab

      - name: Загрузить секреты из REPORT_ENV
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          allowed = [
              "YC_ACCESS_KEY_ID",
              "YC_SECRET_ACCESS_KEY",
              "YC_BUCKET_NAME",
              "WB_PROMO_KEY_TOPFACE",
              "FINICK_API_WB",
              "TELEGRAM_BOT_TOKEN",
              "TELEGRAM_CHAT_ID",
          ]
          report_env = os.getenv("REPORT_ENV", "") or ""
          parsed = {}
          for raw_line in report_env.splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue
              if line.startswith("export "):
                  line = line[len("export "):].strip()
              if "=" not in line:
                  continue
              key, value = line.split("=", 1)
              key = key.strip()
              value = value.strip().strip('"').strip("'")
              if key in allowed and value:
                  parsed[key] = value

          github_env = os.environ["GITHUB_ENV"]
          loaded = []
          with open(github_env, "a", encoding="utf-8") as f:
              for key in allowed:
                  direct = os.getenv(key, "") or ""
                  fallback = parsed.get(key, "")
                  value = direct or fallback
                  if value:
                      f.write(f"{key}={value}\n")
                      loaded.append(key)
          print("Загружены секреты: " + (", ".join(loaded) if loaded else "нет"))
          PY

      - name: Проверить доступы
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          required = ["YC_ACCESS_KEY_ID", "YC_SECRET_ACCESS_KEY", "YC_BUCKET_NAME", "WB_PROMO_KEY_TOPFACE"]
          missing = [x for x in required if not os.getenv(x)]
          if missing:
              msg = "Не найдены обязательные секреты: " + ", ".join(missing)
              print(f"::error title=Не хватает секретов::{msg}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write("## Ошибка запуска\n\n" + msg + "\n")
              raise SystemExit(msg)
          print("Основные доступы найдены.")
          PY

      - name: Определить режим запуска
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event_name = "${{ github.event_name }}"
          schedule = "${{ github.event.schedule }}"
          now_msk = datetime.now(ZoneInfo("Europe/Moscow"))

          if event_name == "workflow_dispatch":
              run_slot = "manual"
              store = "${{ inputs.store }}" or "ALL"
              live = str("${{ inputs.live }}").lower() == "true"
              run_legacy = str("${{ inputs.run_legacy }}").lower() == "true"
          elif schedule == "5 1-23/2 * * *":
              run_slot = "cpm_2h"
              store = "ALL"
              live = str(os.getenv("WB_ADS_V90_LIVE", "false")).lower() == "true"
              run_legacy = False
          else:
              run_slot = "legacy_main"
              store = "TOPFACE"
              live = True
              run_legacy = True

          if store.upper() in {"ALL", "FINICK"} and not os.getenv("FINICK_API_WB"):
              msg = "Для запуска FINICK отсутствует Repository secret FINICK_API_WB"
              print(f"::error title=Нет ключа FINICK::{msg}")
              raise SystemExit(msg)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"RUN_SLOT={run_slot}\n")
              f.write(f"RUN_STORE={store.upper()}\n")
              f.write(f"RUN_LIVE={'true' if live else 'false'}\n")
              f.write(f"RUN_LEGACY={'true' if run_legacy else 'false'}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## Управление рекламой\n\n")
              f.write(f"- Время МСК: **{now_msk:%Y-%m-%d %H:%M:%S}**\n")
              f.write(f"- Режим: **{run_slot}**\n")
              f.write(f"- Магазин: **{store.upper()}**\n")
              f.write(f"- Реальные изменения: **{'ДА' if live else 'НЕТ, только preview'}**\n")
          print(f"МСК: {now_msk:%Y-%m-%d %H:%M:%S}")
          print(f"Режим: {run_slot}; магазин: {store.upper()}; live={live}; legacy={run_legacy}")
          PY

      - name: Проверить код
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f upravlenie_reklamoy.py ]]; then
            echo "::error title=Нет файла кода::В корне репозитория отсутствует upravlenie_reklamoy.py"
            exit 1
          fi
          python -m py_compile upravlenie_reklamoy.py
          echo "Код Python успешно проверен."

      - name: Подготовить конфигурацию рекламы
        if: env.RUN_SLOT == 'manual' || env.RUN_SLOT == 'cpm_2h'
        shell: bash
        env:
          V90_CONFIG_B64: ""
        run: |
          set -euo pipefail
          if [[ -f wb_ads_v90_config.json ]]; then
            echo "Использую wb_ads_v90_config.json из репозитория."
          else
            echo "wb_ads_v90_config.json не найден. Восстанавливаю встроенную конфигурацию workflow."
            python - <<'PY'
          import os, base64
          from pathlib import Path
          raw = base64.b64decode(os.environ["V90_CONFIG_B64"])
          Path("wb_ads_v90_config.json").write_bytes(raw)
          print("Конфигурация восстановлена.")
          PY
          fi
          python -m json.tool wb_ads_v90_config.json >/dev/null
          python - <<'PY'
          import json
          cfg = json.load(open("wb_ads_v90_config.json", encoding="utf-8"))
          topface = cfg.get("stores", {}).get("TOPFACE", {})
          finick = cfg.get("stores", {}).get("FINICK", {})
          profiles = topface.get("profiles", {})
          print("Конфигурация исправна.")
          print("TOPFACE профилей:", len(profiles))
          print("TOPFACE артикулы:", ", ".join(profiles.keys()))
          print("FINICK manage_all_products:", finick.get("manage_all_products"))
          PY

      - name: Запустить управление CPM и CORE-запросами
        if: env.RUN_SLOT == 'manual' || env.RUN_SLOT == 'cpm_2h'
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(
            cpm-manager
            --store "${RUN_STORE}"
            --config wb_ads_v90_config.json
            --stats-days 7
          )
          if [[ "${RUN_LIVE}" == "true" ]]; then
            ARGS+=(--apply-query-bids --apply-campaign-bids --apply-minus)
          fi
          echo "Запуск CPM-контура. Магазин=${RUN_STORE}, live=${RUN_LIVE}"
          python upravlenie_reklamoy.py "${ARGS[@]}"

      - name: Запустить старый контур CPC и полок TOPFACE
        if: env.RUN_LEGACY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUN_SLOT}" == "legacy_main" ]]; then
            python upravlenie_reklamoy.py run --skip-price
          elif [[ "${RUN_LIVE}" == "true" ]]; then
            python upravlenie_reklamoy.py run --skip-price --apply-pause --apply-start
          else
            python upravlenie_reklamoy.py preview --dry-run
          fi

      - name: Сохранить отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Управление-рекламой-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            Предпросмотр_последнего_запуска.xlsx
            Итог_последнего_запуска.xlsx
            Сводка_последнего_запуска.json
            Лог_API.xlsx
            История_ставок.xlsx
            История_пауз.xlsx
            CPM_чистка_запросов.xlsx
            CPM_управление_запросами.xlsx
            CPM_адаптивное_управление_*.xlsx
            V90_*.xlsx
            V90_*.json
            *.log
