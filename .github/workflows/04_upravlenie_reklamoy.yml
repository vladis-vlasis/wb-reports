name: WB Ads V90

on:
  workflow_dispatch:
    inputs:
      store:
        description: "Какой магазин запускать"
        required: true
        default: "ALL"
        type: choice
        options:
          - ALL
          - TOPFACE
          - FINICK
      live:
        description: "Реально менять ставки и минус-фразы"
        required: true
        default: false
        type: boolean
      run_legacy:
        description: "Запускать прежний контур CPC и полок"
        required: true
        default: true
        type: boolean
  schedule:
    # Каждые 2 часа в 00:05, 02:05, 04:05 ... по Москве.
    # GitHub cron работает по UTC; Москва = UTC+3.
    - cron: "5 1-23/2 * * *"

permissions:
  contents: read

concurrency:
  group: wb-ads-v90
  cancel-in-progress: false

jobs:
  manage-ads:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      PYTHONUNBUFFERED: "1"
      TZ: Europe/Moscow
      WB_ADS_V90_CONFIG: wb_ads_v90_config.json

      YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      YC_BUCKET_NAME: ${{ secrets.YC_BUCKET_NAME }}

      WB_PROMO_KEY_TOPFACE: ${{ secrets.WB_PROMO_KEY_TOPFACE }}
      FINICK_API_WB: ${{ secrets.FINICK_API_WB }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve run mode
        id: mode
        shell: bash
        run: |
          STORE="ALL"
          LIVE="${{ vars.WB_ADS_V90_LIVE }}"
          RUN_LEGACY="${{ vars.WB_ADS_RUN_LEGACY }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            STORE="${{ inputs.store }}"
            LIVE="${{ inputs.live }}"
            RUN_LEGACY="${{ inputs.run_legacy }}"
          fi

          if [[ -z "$LIVE" ]]; then LIVE="false"; fi
          if [[ -z "$RUN_LEGACY" ]]; then RUN_LEGACY="true"; fi

          echo "store=$STORE" >> "$GITHUB_OUTPUT"
          echo "live=$LIVE" >> "$GITHUB_OUTPUT"
          echo "run_legacy=$RUN_LEGACY" >> "$GITHUB_OUTPUT"

          echo "Store: $STORE"
          echo "Live changes: $LIVE"
          echo "Legacy CPC/shelves: $RUN_LEGACY"

      - name: Run V90 adaptive CPM manager
        shell: bash
        run: |
          ARGS=(
            cpm-manager
            --store "${{ steps.mode.outputs.store }}"
            --config wb_ads_v90_config.json
            --stats-days 7
          )

          if [[ "${{ steps.mode.outputs.live }}" == "true" ]]; then
            ARGS+=(
              --apply-query-bids
              --apply-campaign-bids
              --apply-minus
            )
          fi

          python upravlenie_reklamoy.py "${ARGS[@]}"

      - name: Run legacy CPC and shelves contour
        if: steps.mode.outputs.run_legacy == 'true'
        shell: bash
        run: |
          if [[ "${{ steps.mode.outputs.live }}" == "true" ]]; then
            python upravlenie_reklamoy.py run --apply-pause --apply-start
          else
            python upravlenie_reklamoy.py preview --dry-run
          fi

      - name: Upload run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wb-ads-v90-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            *.xlsx
            *.json
            *.log
