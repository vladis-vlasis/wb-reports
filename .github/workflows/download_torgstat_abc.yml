name: Загрузка Внешних источников
# Назначение: Торгстат АБС-анализ и Точки входа ВБ.
# Файл в репозитории: .github/workflows/download_external_sources.yml

run-name: Загрузка внешних источников — ${{ github.event.inputs.source || 'all' }} / ${{ github.event.inputs.mode || 'auto' }}

on:
  schedule:
    # Каждый день в 18:00 МСК / 15:00 UTC.
    # AUTO:
    # - ежедневно выгружает Торгстат АБС за вчера;
    # - по понедельникам дополнительно выгружает закрытую неделю Торгстат АБС
    #   и отчёт WB «Портрет покупателя → Точки входа» за прошлый Mon-Sun.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Источник: Торгстат АБС-анализ и/или Точки входа ВБ"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - torgstat_abc
          - wb_entry_points
      mode:
        description: "Период выгрузки"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - daily
          - weekly
          - custom
      date_from:
        description: "Дата начала для custom или дата для daily: YYYY-MM-DD"
        required: false
        default: ""
      date_to:
        description: "Дата окончания для custom: YYYY-MM-DD"
        required: false
        default: ""
      dry_run:
        description: "Проверить secrets, URL и периоды без скачивания и загрузки"
        required: false
        default: false
        type: boolean

jobs:
  download-external-sources:
    name: Торгстат АБС-анализ и Точки входа ВБ
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REPORT_ENV: ${{ secrets.REPORT_ENV }}
      TORGSTAT_ABC_CURL: ${{ secrets.TORGSTAT_ABC_CURL }}
      WB_ENTRY_POINTS_CURLS: ${{ secrets.WB_ENTRY_POINTS_CURLS }}
      YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      YC_BUCKET_NAME: ${{ secrets.YC_BUCKET_NAME }}
      YC_ENDPOINT_URL: ${{ secrets.YC_ENDPOINT_URL }}
      AWS_DEFAULT_REGION: ru-central1
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install requests boto3 openpyxl

      - name: Show schedule and selected mode
        shell: bash
        run: |
          set -euo pipefail
          echo "UTC now: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "MSK now: $(TZ=Europe/Moscow date '+%Y-%m-%d %H:%M:%S')"
          echo "Workflow: Загрузка Внешних источников"
          echo "Sources: Торгстат АБС-анализ и Точки входа ВБ"

      - name: Download and upload external sources
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="${{ github.event.inputs.source || 'all' }}"
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          DATE_FROM="${{ github.event.inputs.date_from || '' }}"
          DATE_TO="${{ github.event.inputs.date_to || '' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          ARGS=(
            --source "$SOURCE"
            --mode "$MODE"
            --store TOPFACE
            --reports-root "Отчёты"
            --abc-folder "ABC"
            --wb-entry-folder "Точки входа"
            --wb-max-wait-minutes 20
          )

          if [ -n "$DATE_FROM" ]; then
            ARGS+=(--date-from "$DATE_FROM")
          fi
          if [ -n "$DATE_TO" ]; then
            ARGS+=(--date-to "$DATE_TO")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          echo "source=$SOURCE mode=$MODE date_from=$DATE_FROM date_to=$DATE_TO dry_run=$DRY_RUN"
          python download_external_sources.py "${ARGS[@]}"
