name: WB TOPFACE Daily Report

on:
  schedule:
    # GitHub cron is UTC. 22:05 UTC = 01:05 MSK next day.
    # report_runner.py itself applies the MSK rule:
    # 00:00-18:59 MSK => D-2, 19:00-23:59 MSK => D-1.
    - cron: '5 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим запуска'
        required: true
        default: 'full_refresh'
        type: choice
        options:
          - full_refresh
          - current_week
          - pdf_only
          - preflight
          - smoke
      send_telegram:
        description: 'Отправить отчет в Telegram'
        required: true
        default: true
        type: boolean
      target_date:
        description: 'Дата отчета YYYY-MM-DD. Пусто = авто по московскому правилу.'
        required: false
        default: ''
        type: string

concurrency:
  group: wb-topface-report-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-report:
    name: Build TOPFACE report
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      TZ: Europe/Moscow

      # Основной источник секретов. Никакие новые имена не требуются.
      REPORT_ENV: ${{ secrets.REPORT_ENV || vars.REPORT_ENV }}

      # Прямые старые секреты оставлены только как fallback, если они уже есть в репозитории.
      YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID || vars.YC_ACCESS_KEY_ID }}
      YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY || vars.YC_SECRET_ACCESS_KEY }}
      YC_BUCKET_NAME: ${{ secrets.YC_BUCKET_NAME || vars.YC_BUCKET_NAME }}
      YC_ENDPOINT_URL: ${{ secrets.YC_ENDPOINT_URL || vars.YC_ENDPOINT_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
      TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID || vars.TELEGRAM_MESSAGE_THREAD_ID }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN || vars.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID || vars.TG_CHAT_ID }}
      TG_THREAD_ID: ${{ secrets.TG_THREAD_ID || vars.TG_THREAD_ID }}

      # Не отменяем запуск по времени. Дату выбирает сам report_runner.py.
      REPORT_RUN_SOURCE: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
      REPORT_ENFORCE_MSK_RUN_WINDOW: '0'
      REPORT_MANUAL_BYPASS_MSK_WINDOW: '1'
      REPORT_AUTO_COMPLETE_DATE: '0'
      REPORT_REQUIRE_ABC_PERIOD: '0'
      WB_KEEP_ONLY_MONDAY_REPORTS: '1'
      WB_LOCALIZATION_MAX_STALE_DAYS: '2'
      ALLOW_LOCAL_STORAGE: '0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pandas numpy openpyxl boto3 reportlab requests

      - name: Validate report_runner.py is the main report script
        run: |
          set -euo pipefail
          test -f report_runner.py
          python -m py_compile report_runner.py
          python - <<'PY'
          from pathlib import Path

          src = Path('report_runner.py').read_text(encoding='utf-8', errors='replace')
          print('report_runner.py first lines:')
          print('\n'.join(src.splitlines()[:12]))

          bad_markers = [
              'add_argument("--ads", required=True',
              "add_argument('--ads', required=True",
              '--pause-history',
              '--bid-history',
          ]
          required_markers = [
              '--root',
              '--reports-root',
              '--store',
              '--full-refresh',
              '--send-telegram',
          ]

          bad = [m for m in bad_markers if m in src]
          missing = [m for m in required_markers if m not in src]
          if bad or missing:
              raise SystemExit(
                  'Неверный report_runner.py в репозитории: сейчас лежит не основной отчетный файл. '
                  'Нужно заменить файл report_runner.py на последнюю версию основного отчета. '
                  f'bad_markers={bad}; missing_markers={missing}'
              )

          print('report_runner identity: OK')
          PY

      - name: Normalize REPORT_ENV and fail fast checks
        env:
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full_refresh' }}
          SEND_TELEGRAM_INPUT: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.send_telegram) || 'true' }}
          TARGET_DATE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.target_date || '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from datetime import datetime
          from pathlib import Path
          import boto3

          run_mode = os.environ.get('RUN_MODE', 'full_refresh')
          send_telegram = os.environ.get('SEND_TELEGRAM_INPUT', 'true').lower() == 'true'
          target_date = os.environ.get('TARGET_DATE_INPUT', '').strip()

          def parse_env_blob(text):
              result = {}
              for raw in (text or '').splitlines():
                  line = raw.strip()
                  if not line or line.startswith('#'):
                      continue
                  if line.startswith('export '):
                      line = line[len('export '):].strip()
                  if '=' not in line:
                      continue
                  key, value = line.split('=', 1)
                  key = key.strip()
                  value = value.strip()
                  if not re.match(r'^[A-Za-z_][A-Za-z0-9_]*$', key):
                      continue
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in {'"', "'"}:
                      value = value[1:-1]
                  result[key] = value
              return result

          parsed = parse_env_blob(os.environ.get('REPORT_ENV', ''))
          print(f'REPORT_ENV: {"OK" if parsed else "MISSING/EMPTY"}; loaded={len(parsed)}')

          env = dict(os.environ)
          # REPORT_ENV has priority over empty job env fallbacks.
          env.update({k: v for k, v in parsed.items() if str(v).strip()})

          def first(names, default=''):
              for name in names:
                  value = env.get(name, '')
                  if str(value).strip():
                      return str(value).strip(), name
              return default, 'default' if default else ''

          access, access_src = first(['YC_ACCESS_KEY_ID', 'AWS_ACCESS_KEY_ID', 'S3_ACCESS_KEY_ID', 'ACCESS_KEY_ID'])
          secret, secret_src = first(['YC_SECRET_ACCESS_KEY', 'AWS_SECRET_ACCESS_KEY', 'S3_SECRET_ACCESS_KEY', 'SECRET_ACCESS_KEY'])
          bucket, bucket_src = first(['YC_BUCKET_NAME', 'S3_BUCKET', 'S3_BUCKET_NAME', 'BUCKET_NAME', 'BUCKET'])
          endpoint, endpoint_src = first(['YC_ENDPOINT_URL', 'S3_ENDPOINT_URL', 'AWS_ENDPOINT_URL'], 'https://storage.yandexcloud.net')

          token, token_src = first(['TELEGRAM_BOT_TOKEN', 'TG_BOT_TOKEN', 'TELEGRAM_TOKEN', 'TG_TOKEN', 'BOT_TOKEN'])
          chat, chat_src = first(['TELEGRAM_CHAT_ID', 'TG_CHAT_ID', 'TELEGRAM_CHAT', 'TG_CHAT', 'CHAT_ID'])
          thread, thread_src = first(['TELEGRAM_MESSAGE_THREAD_ID', 'TELEGRAM_THREAD_ID', 'TG_THREAD_ID', 'THREAD_ID'])

          if not access or not secret or not bucket:
              raise SystemExit(
                  'Object Storage credentials missing before heavy calculations. '
                  f'access={"OK" if access else "MISSING"}({access_src or "-"}); '
                  f'secret={"OK" if secret else "MISSING"}({secret_src or "-"}); '
                  f'bucket={"OK" if bucket else "MISSING"}({bucket_src or "-"}). '
                  'Проверь REPORT_ENV: в нем должны быть рабочие ключи хранилища.'
              )

          if send_telegram and run_mode not in {'smoke', 'preflight'} and (not token or not chat):
              raise SystemExit(
                  'Telegram credentials missing before heavy calculations. '
                  f'token={"OK" if token else "MISSING"}({token_src or "-"}); '
                  f'chat={"OK" if chat else "MISSING"}({chat_src or "-"}). '
                  'Проверь REPORT_ENV или старые TELEGRAM_* secrets.'
              )

          # Проверяем S3 сразу, до тяжелого расчета.
          s3 = boto3.client(
              's3',
              endpoint_url=endpoint,
              aws_access_key_id=access,
              aws_secret_access_key=secret,
          )
          resp = s3.list_objects_v2(Bucket=bucket, Prefix='Отчёты/', MaxKeys=3)
          print(f'Object Storage: OK; bucket={bucket}; endpoint_source={endpoint_src}; objects_seen={len(resp.get("Contents", []))}')
          print(f'Telegram: token={"OK" if token else "not requested/missing"}({token_src or "-"}); chat={"OK" if chat else "not requested/missing"}({chat_src or "-"}); thread={"OK" if thread else "not set"}({thread_src or "-"})')

          values = {
              'YC_ACCESS_KEY_ID': access,
              'YC_SECRET_ACCESS_KEY': secret,
              'YC_BUCKET_NAME': bucket,
              'YC_ENDPOINT_URL': endpoint,
              'AWS_ACCESS_KEY_ID': access,
              'AWS_SECRET_ACCESS_KEY': secret,
              'S3_BUCKET': bucket,
              'S3_BUCKET_NAME': bucket,
              'S3_ENDPOINT_URL': endpoint,
          }
          if token:
              values['TELEGRAM_BOT_TOKEN'] = token
          if chat:
              values['TELEGRAM_CHAT_ID'] = chat
          if thread:
              values['TELEGRAM_MESSAGE_THREAD_ID'] = thread
          if target_date:
              if not re.match(r'^\d{4}-\d{2}-\d{2}$', target_date):
                  raise SystemExit(f'target_date must be YYYY-MM-DD, got: {target_date}')
              values['REPORT_MANUAL_TARGET_DATE'] = target_date
              values['REPORT_KEEP_EXPLICIT_DATE'] = '1'

          sensitive_re = re.compile(r'(KEY|SECRET|TOKEN|PASSWORD|PASS|CHAT_ID|THREAD_ID)', re.I)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              for key, value in values.items():
                  if value is None or str(value) == '':
                      continue
                  value = str(value)
                  if sensitive_re.search(key):
                      print(f'::add-mask::{value}')
                  f.write(f'{key}<<__{key}__\n{value}\n__{key}__\n')
          PY

      - name: Run report
        env:
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full_refresh' }}
          SEND_TELEGRAM_INPUT: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.send_telegram) || 'true' }}
        run: |
          set -euo pipefail

          echo "Run mode: ${RUN_MODE}"
          echo "Send Telegram: ${SEND_TELEGRAM_INPUT}"
          echo "MSK now: $(TZ=Europe/Moscow date '+%Y-%m-%d %H:%M:%S')"

          ARGS=(--root "." --reports-root "Отчёты" --store "TOPFACE")

          case "${RUN_MODE}" in
            full_refresh)
              export WB_CURRENT_WEEK_ONLY="0"
              ARGS+=(--full-refresh)
              ;;
            current_week)
              export WB_CURRENT_WEEK_ONLY="1"
              ARGS+=(--current-week-only)
              ;;
            pdf_only)
              export WB_CURRENT_WEEK_ONLY="1"
              ARGS+=(--pdf-only)
              ;;
            preflight)
              export WB_CURRENT_WEEK_ONLY="1"
              ARGS+=(--preflight-date-check)
              ;;
            smoke)
              export WB_CURRENT_WEEK_ONLY="0"
              ARGS+=(--smoke-test)
              ;;
            *)
              echo "Unknown RUN_MODE=${RUN_MODE}"
              exit 2
              ;;
          esac

          if [ "${SEND_TELEGRAM_INPUT}" = "true" ] && [ "${RUN_MODE}" != "smoke" ] && [ "${RUN_MODE}" != "preflight" ]; then
            ARGS+=(--send-telegram)
          fi

          echo "Running: python report_runner.py ${ARGS[*]}"
          python report_runner.py "${ARGS[@]}"
