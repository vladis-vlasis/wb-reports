name: Документы по поставкам TOPFACE V10
# ПОСТОЯННЫЕ ИМЕНА В GITHUB:
# Python:   wb_supply_documents.py
# Workflow: .github/workflows/wb_supply_documents.yml
# Файлы wb_supply_documents_v10.* — только версия для скачивания и замены содержимого.

run-name: Поставки и УПД TOPFACE V10 — ${{ github.event.inputs.supply_message_mode || 'changes_only' }}

on:
  schedule:
    - cron: "30 16 * * *"  # 19:30 МСК
  workflow_dispatch:
    inputs:
      mode:
        description: "Технический режим запуска"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - bootstrap

      upd_send_mode:
        description: "Как отправлять новый УПД в Telegram"
        required: true
        default: "message_and_upd"
        type: choice
        options:
          - message_and_upd
          - message_only

      supply_message_mode:
        description: "Какие поставки включить в сообщение"
        required: true
        default: "changes_only"
        type: choice
        options:
          - changes_only
          - selected_period

      supply_period:
        description: "Период поставок для selected_period"
        required: true
        default: "7_days"
        type: choice
        options:
          - today
          - 3_days
          - 7_days
          - 14_days
          - 30_days
          - 45_days
          - custom

      supply_date_from:
        description: "Начало custom-периода, YYYY-MM-DD"
        required: false
        default: ""
        type: string

      supply_date_to:
        description: "Конец custom-периода, YYYY-MM-DD"
        required: false
        default: ""
        type: string

      telegram_min_supply_qty:
        description: "Не писать в Telegram о поставках меньше этого количества"
        required: true
        default: "100"
        type: string

      lookback_days:
        description: "Сколько дней поставок загружать из WB"
        required: true
        default: "45"
        type: string

      document_lookback_days:
        description: "Сколько дней документов WB проверять"
        required: true
        default: "21"
        type: string

      force_notify:
        description: "Повторно отправить текущие события по поставкам"
        required: false
        default: false
        type: boolean

      dry_run:
        description: "Проверить secrets и параметры без запросов к WB"
        required: false
        default: false
        type: boolean

jobs:
  wb-supply-documents:
    name: Контроль поставок, УПД и актов TOPFACE V10
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: wb-supply-documents-topface
      cancel-in-progress: false

    env:
      REPORT_ENV: ${{ secrets.REPORT_ENV }}
      WB_PROMO_KEY_TOPFACE: ${{ secrets.WB_PROMO_KEY_TOPFACE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      AWS_DEFAULT_REGION: ru-central1
      WB_SUPPLY_DOCS_ROOT: "Документы по поставкам/TOPFACE"
      WB_NOTIFY_STATUS_IDS: "4,5,6"
      WB_DEEP_LOOKBACK_DAYS: "21"
      WB_MAX_DEEP_SUPPLIES: "180"
      # 0 = скачать все новые документы, а не только первые 20.
      WB_MAX_DOCUMENT_DOWNLOADS: "0"
      WB_FIRST_RUN_NOTIFY_DAYS: "3"
      WB_TELEGRAM_MIN_SUPPLY_QTY: "100"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install requests boto3 openpyxl

      - name: Verify repository script
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT_PATH="./wb_supply_documents.py"
          EXPECTED_VERSION="WB_SUPPLY_DOCUMENTS_TOPFACE_V10_20260731"

          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "::error::Не найден $SCRIPT_PATH. В GitHub файл всегда называется wb_supply_documents.py."
            exit 1
          fi

          ACTUAL_VERSION="$(grep -m1 '^VERSION = ' "$SCRIPT_PATH" || true)"
          echo "Selected script: $SCRIPT_PATH"
          echo "Detected: $ACTUAL_VERSION"

          if ! grep -q "$EXPECTED_VERSION" "$SCRIPT_PATH"; then
            echo "::error::В wb_supply_documents.py находится не версия $EXPECTED_VERSION. Замени содержимое кодом из wb_supply_documents_v10.py."
            exit 1
          fi

          python -m py_compile "$SCRIPT_PATH"
          python "$SCRIPT_PATH" --self-test
          echo "WB_SUPPLY_DOCUMENTS_SCRIPT=$SCRIPT_PATH" >> "$GITHUB_ENV"

      - name: Verify existing secrets
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${WB_PROMO_KEY_TOPFACE:-}" ] || { echo "::error::Пустой secret WB_PROMO_KEY_TOPFACE"; exit 1; }
          [ -n "${REPORT_ENV:-}" ] || { echo "::error::Пустой secret REPORT_ENV"; exit 1; }
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ] || { echo "::error::Пустой secret TELEGRAM_BOT_TOKEN"; exit 1; }
          [ -n "${TELEGRAM_CHAT_ID:-}" ] || { echo "::error::Пустой secret TELEGRAM_CHAT_ID"; exit 1; }
          echo "Existing secrets: OK (values are not printed)"

      - name: Run supply and document monitor
        shell: bash
        run: |
          set -euo pipefail

          MODE="${{ github.event.inputs.mode || 'auto' }}"
          UPD_SEND_MODE="${{ github.event.inputs.upd_send_mode || 'message_and_upd' }}"
          SUPPLY_MESSAGE_UI="${{ github.event.inputs.supply_message_mode || 'changes_only' }}"
          SUPPLY_PERIOD="${{ github.event.inputs.supply_period || '7_days' }}"
          SUPPLY_DATE_FROM="${{ github.event.inputs.supply_date_from || '' }}"
          SUPPLY_DATE_TO="${{ github.event.inputs.supply_date_to || '' }}"
          TELEGRAM_MIN_SUPPLY_QTY="${{ github.event.inputs.telegram_min_supply_qty || '100' }}"
          LOOKBACK="${{ github.event.inputs.lookback_days || '45' }}"
          DOC_LOOKBACK="${{ github.event.inputs.document_lookback_days || '21' }}"
          FORCE_NOTIFY="${{ github.event.inputs.force_notify || 'false' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          if [[ ! "$TELEGRAM_MIN_SUPPLY_QTY" =~ ^[0-9]+$ ]]; then
            echo "::error::telegram_min_supply_qty должен быть целым неотрицательным числом"
            exit 1
          fi

          ARGS=(
            --lookback-days "$LOOKBACK"
            --document-lookback-days "$DOC_LOOKBACK"
            --root-prefix "Документы по поставкам/TOPFACE"
            --upd-send-mode "$UPD_SEND_MODE"
            --telegram-min-supply-qty "$TELEGRAM_MIN_SUPPLY_QTY"
          )

          case "$SUPPLY_MESSAGE_UI" in
            changes_only)
              ARGS+=(--supply-message-mode changes_only)
              ;;
            selected_period)
              ARGS+=(--supply-message-mode period)
              case "$SUPPLY_PERIOD" in
                today)   ARGS+=(--supply-period-days 1) ;;
                3_days)  ARGS+=(--supply-period-days 3) ;;
                7_days)  ARGS+=(--supply-period-days 7) ;;
                14_days) ARGS+=(--supply-period-days 14) ;;
                30_days) ARGS+=(--supply-period-days 30) ;;
                45_days) ARGS+=(--supply-period-days 45) ;;
                custom)
                  if [[ ! "$SUPPLY_DATE_FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || \
                     [[ ! "$SUPPLY_DATE_TO" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                    echo "::error::Для custom укажи supply_date_from и supply_date_to в формате YYYY-MM-DD"
                    exit 1
                  fi
                  ARGS+=(--supply-date-from "$SUPPLY_DATE_FROM" --supply-date-to "$SUPPLY_DATE_TO")
                  ;;
                *)
                  echo "::error::Неизвестный supply_period=$SUPPLY_PERIOD"
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::Неизвестный supply_message_mode=$SUPPLY_MESSAGE_UI"
              exit 1
              ;;
          esac

          if [ "$MODE" = "bootstrap" ]; then
            ARGS+=(--first-run-notify-days "$LOOKBACK")
          fi
          if [ "$FORCE_NOTIFY" = "true" ]; then
            ARGS+=(--force-notify)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          echo "script=$WB_SUPPLY_DOCUMENTS_SCRIPT"
          echo "expected_version=WB_SUPPLY_DOCUMENTS_TOPFACE_V10_20260731"
          echo "upd_send_mode=$UPD_SEND_MODE"
          echo "telegram_min_supply_qty=$TELEGRAM_MIN_SUPPLY_QTY"
          echo "supply_message_mode=$SUPPLY_MESSAGE_UI supply_period=$SUPPLY_PERIOD custom=$SUPPLY_DATE_FROM..$SUPPLY_DATE_TO"
          echo "lookback=$LOOKBACK document_lookback=$DOC_LOOKBACK force_notify=$FORCE_NOTIFY dry_run=$DRY_RUN"
          python "$WB_SUPPLY_DOCUMENTS_SCRIPT" "${ARGS[@]}"
