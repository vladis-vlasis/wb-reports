name: Документы по поставкам TOPFACE V6
# Python в корне репозитория: wb_supply_documents_TOPFACE_v6_20260731.py
# Workflow: .github/workflows/wb_supply_documents_TOPFACE_v6_20260731.yml
# ВАЖНО: workflow запускает строго файл V6 и проверяет внутреннюю VERSION V6.

run-name: Поставки и УПД TOPFACE V6 — ${{ github.event.inputs.mode || 'auto' }}

on:
  schedule:
    - cron: "30 16 * * *"  # 19:30 МСК
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим запуска"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - bootstrap
      lookback_days:
        description: "Сколько дней поставок проверять"
        required: true
        default: "45"
      document_lookback_days:
        description: "Сколько дней документов WB проверять"
        required: true
        default: "21"
      force_notify:
        description: "Повторно прислать актуальные поставки со статусами 4/5/6"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Проверить secrets и настройки без запросов к WB"
        required: false
        default: false
        type: boolean

jobs:
  wb-supply-documents-v6:
    name: Контроль поставок, УПД и актов TOPFACE V6
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: wb-supply-documents-topface-v6
      cancel-in-progress: false

    env:
      # Используются только уже существующие secrets репозитория.
      REPORT_ENV: ${{ secrets.REPORT_ENV }}
      WB_PROMO_KEY_TOPFACE: ${{ secrets.WB_PROMO_KEY_TOPFACE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      AWS_DEFAULT_REGION: ru-central1
      WB_SUPPLY_DOCS_ROOT: "Документы по поставкам/TOPFACE"
      WB_NOTIFY_STATUS_IDS: "4,5,6"
      WB_DEEP_LOOKBACK_DAYS: "21"
      WB_MAX_DEEP_SUPPLIES: "180"
      WB_MAX_DOCUMENT_DOWNLOADS: "20"
      WB_FIRST_RUN_NOTIFY_DAYS: "3"
      TELEGRAM_SEND_UPD_FILES: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install requests boto3 openpyxl

      - name: Verify exact V6 script
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT_PATH="./wb_supply_documents_TOPFACE_v6_20260731.py"
          EXPECTED_VERSION="WB_SUPPLY_DOCUMENTS_TOPFACE_V6_20260731"

          echo "Files in repository root:"
          find . -maxdepth 2 -type f | sort

          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "::error::Не найден $SCRIPT_PATH. Файл должен лежать в корне репозитория без переименования."
            exit 1
          fi

          ACTUAL_VERSION="$(grep -m1 '^VERSION = ' "$SCRIPT_PATH" || true)"
          echo "Selected script: $SCRIPT_PATH"
          echo "Detected: $ACTUAL_VERSION"

          if ! grep -q "$EXPECTED_VERSION" "$SCRIPT_PATH"; then
            echo "::error::В $SCRIPT_PATH находится не версия $EXPECTED_VERSION."
            exit 1
          fi

          python -m py_compile "$SCRIPT_PATH"
          python "$SCRIPT_PATH" --self-test
          echo "WB_SUPPLY_DOCUMENTS_SCRIPT=$SCRIPT_PATH" >> "$GITHUB_ENV"

      - name: Verify existing secrets
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${WB_PROMO_KEY_TOPFACE:-}" ] || { echo "::error::Пустой существующий secret WB_PROMO_KEY_TOPFACE"; exit 1; }
          [ -n "${REPORT_ENV:-}" ] || { echo "::error::Пустой существующий secret REPORT_ENV"; exit 1; }
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ] || { echo "::error::Пустой существующий secret TELEGRAM_BOT_TOKEN"; exit 1; }
          [ -n "${TELEGRAM_CHAT_ID:-}" ] || { echo "::error::Пустой существующий secret TELEGRAM_CHAT_ID"; exit 1; }
          echo "Existing secrets: OK (values are not printed)"

      - name: Run supply and document monitor V6
        shell: bash
        run: |
          set -euo pipefail

          MODE="${{ github.event.inputs.mode || 'auto' }}"
          LOOKBACK="${{ github.event.inputs.lookback_days || '45' }}"
          DOC_LOOKBACK="${{ github.event.inputs.document_lookback_days || '21' }}"
          FORCE_NOTIFY="${{ github.event.inputs.force_notify || 'false' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          ARGS=(
            --lookback-days "$LOOKBACK"
            --document-lookback-days "$DOC_LOOKBACK"
            --root-prefix "Документы по поставкам/TOPFACE"
          )

          if [ "$MODE" = "bootstrap" ]; then
            ARGS+=(--first-run-notify-days "$LOOKBACK")
          fi
          if [ "$FORCE_NOTIFY" = "true" ]; then
            ARGS+=(--force-notify)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          echo "script=$WB_SUPPLY_DOCUMENTS_SCRIPT"
          echo "expected_version=WB_SUPPLY_DOCUMENTS_TOPFACE_V6_20260731"
          echo "mode=$MODE lookback=$LOOKBACK document_lookback=$DOC_LOOKBACK force_notify=$FORCE_NOTIFY dry_run=$DRY_RUN"
          python "$WB_SUPPLY_DOCUMENTS_SCRIPT" "${ARGS[@]}"
