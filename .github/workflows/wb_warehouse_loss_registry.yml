# Workflow version: TOPFACE_V4_TG_ALWAYS_ON_20260805_1455
# Runs: wb_warehouse_loss_registry_TOPFACE_V4_TELEGRAM_FIX_20260805_1330.py
name: WB Warehouse Loss Registry TOPFACE V4 TG Always On

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: "Начало периода, YYYY-MM-DD"
        required: true
        default: "2026-01-01"
        type: string
      date_to:
        description: "Конец периода, YYYY-MM-DD. Пусто = текущая дата"
        required: false
        default: ""
        type: string
      aging_threshold_days:
        description: "Порог залежалой непроданной партии, дней"
        required: true
        default: "120"
        type: string
      incident_dates_json:
        description: 'Необязательная ручная корректировка дат. Обычно оставить {}'
        required: false
        default: "{}"
        type: string
      resend_current_only:
        description: "Только повторно отправить готовый Текущий_реестр.xlsx без пересчёта"
        required: true
        default: false
        type: boolean

  # Каждый понедельник в 19:30 МСК = 16:30 UTC.
  schedule:
    - cron: "30 16 * * 1"

concurrency:
  group: wb-warehouse-loss-registry-topface-v4-tg-always-on
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-send-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TZ: Europe/Moscow
      WB_STORE: TOPFACE

      WB_PROMO_KEY_TOPFACE: ${{ secrets.WB_PROMO_KEY_TOPFACE }}
      WB_FINANCE_KEY_TOPFACE: ${{ secrets.WB_FINANCE_KEY_TOPFACE }}

      YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      YC_BUCKET_NAME: ${{ secrets.YC_BUCKET_NAME }}
      YC_ENDPOINT_URL: ${{ secrets.YC_ENDPOINT_URL }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}

      REPORT_ENV: ${{ secrets.REPORT_ENV }}

      WB_SHUTDOWN_CONFIRM_DAYS: "3"
      WB_MIN_ACTIVE_ORDER_DAYS: "2"
      WB_MIN_ACTIVE_ORDERS: "5"
      WB_INCIDENT_DETECTION_LOOKBACK_DAYS: "14"
      WB_MIN_ACTIVE_BARCODES: "3"
      WB_MIN_STOCK_AT_STOP: "10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pandas openpyxl requests

      - name: Validate script
        run: |
          python -m py_compile wb_warehouse_loss_registry_TOPFACE_V4_TELEGRAM_FIX_20260805_1330.py
          python wb_warehouse_loss_registry_TOPFACE_V4_TELEGRAM_FIX_20260805_1330.py --self-test

      - name: Build registry or resend current file
        shell: bash
        env:
          INPUT_DATE_FROM: ${{ inputs.date_from }}
          INPUT_DATE_TO: ${{ inputs.date_to }}
          INPUT_AGING_THRESHOLD: ${{ inputs.aging_threshold_days }}
          INPUT_INCIDENT_DATES_JSON: ${{ inputs.incident_dates_json }}
          INPUT_RESEND_CURRENT_ONLY: ${{ inputs.resend_current_only }}
        run: |
          set -euo pipefail

          DATE_FROM="${INPUT_DATE_FROM:-2026-01-01}"
          DATE_TO="${INPUT_DATE_TO:-}"
          AGING_THRESHOLD="${INPUT_AGING_THRESHOLD:-120}"
          INCIDENT_DATES_JSON="${INPUT_INCIDENT_DATES_JSON:-}"
          RESEND_CURRENT_ONLY="${INPUT_RESEND_CURRENT_ONLY:-false}"

          ARGS=(--store TOPFACE)

          if [[ "$RESEND_CURRENT_ONLY" == "true" ]]; then
            ARGS+=(--send-current-only)
          else
            ARGS+=(
              --date-from "$DATE_FROM"
              --aging-threshold-days "$AGING_THRESHOLD"
            )

            if [[ -n "$DATE_TO" ]]; then
              ARGS+=(--date-to "$DATE_TO")
            fi

            if [[ -n "${INCIDENT_DATES_JSON//[[:space:]]/}" && "$INCIDENT_DATES_JSON" != "{}" ]]; then
              ARGS+=(--incident-dates-json "$INCIDENT_DATES_JSON")
            fi
          fi

          # Telegram всегда включён: --no-telegram намеренно не используется.
          printf 'Запуск команды:'
          printf ' %q' python wb_warehouse_loss_registry_TOPFACE_V4_TELEGRAM_FIX_20260805_1330.py "${ARGS[@]}"
          printf '\n'

          python wb_warehouse_loss_registry_TOPFACE_V4_TELEGRAM_FIX_20260805_1330.py "${ARGS[@]}"
