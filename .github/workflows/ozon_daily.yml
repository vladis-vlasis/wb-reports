name: Ozon daily sales funnel

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: write

concurrency:
  group: ozon-daily-sales-funnel
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.54.0
          playwright install --with-deps chromium

      - name: Collect Ozon data
        env:
          OZON_AUTH_JSON: ${{ secrets.OZON_AUTH_JSON }}
        run: python ozon_daily.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Ozon funnel $(date -u +%F)"
          git push

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ozon-screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 30
