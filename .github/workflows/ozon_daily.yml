name: Ozon daily sales funnel

on:
  workflow_dispatch:
    inputs:
      headless:
        description: "Первый запуск: false, затем true"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: write

concurrency:
  group: ozon-daily-sales-funnel
  cancel-in-progress: false

jobs:
  collect:
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.54.0
          playwright install chromium

      - name: Collect Ozon data
        shell: powershell
        env:
          OZON_AUTH_JSON: ${{ secrets.SECRET_OZON_AUTH_JSON }}
          OZON_HEADLESS: ${{ github.event_name == 'workflow_dispatch' && inputs.headless || 'true' }}
          OZON_PROFILE_DIR: C:\ozon-playwright-profile
        run: python ozon_daily.py

      - name: Commit data
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Ozon funnel $(Get-Date -Format yyyy-MM-dd)"
            git push
          }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ozon-screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 30
