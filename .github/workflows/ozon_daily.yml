name: Ozon daily sales funnel

on:
  workflow_dispatch:
    inputs:
      headless:
        description: "Открывать браузер скрыто"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: write

concurrency:
  group: ozon-daily-sales-funnel
  cancel-in-progress: true

jobs:
  collect:
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 25

    steps:
      - name: Clone repository
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          Get-ChildItem -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          git clone --branch main "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" .

      - name: Install dependencies and collect data
        shell: powershell
        env:
          OZON_AUTH_JSON: ${{ secrets.SECRET_OZON_AUTH_JSON }}
          OZON_HEADLESS: ${{ github.event_name == 'workflow_dispatch' && inputs.headless || 'true' }}
          OZON_PROFILE_DIR: C:\ozon-playwright-profile
        run: |
          if (Get-Command py -ErrorAction SilentlyContinue) {
            py -3 -m pip install --upgrade pip
            py -3 -m pip install playwright==1.54.0
            py -3 -m playwright install chromium
            py -3 ozon_daily.py
          }
          elseif (Get-Command python -ErrorAction SilentlyContinue) {
            python -m pip install --upgrade pip
            python -m pip install playwright==1.54.0
            python -m playwright install chromium
            python ozon_daily.py
          }
          else {
            throw "Python не установлен или не добавлен в PATH"
          }

      - name: Commit results
        if: success()
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ screenshots/
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Ozon funnel $(Get-Date -Format yyyy-MM-dd_HH-mm)"
            git push origin main
          }
